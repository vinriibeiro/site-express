<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>og</title><style>
@font-face{font-family:"Sora";src:url("../assets/fonts/sora-latin.woff2") format("woff2");font-weight:500 700}
@font-face{font-family:"Inter";src:url("../assets/fonts/inter-latin.woff2") format("woff2");font-weight:400 600}
html,body{margin:0}
.og{width:1200px;height:630px;box-sizing:border-box;padding:64px 72px;background:radial-gradient(60% 70% at 95% 0%,rgba(217,248,111,.35),transparent 60%),linear-gradient(160deg,#12463a,#103b30 55%,#0b2a22);color:#f3f3ed;font-family:Inter,sans-serif;display:flex;flex-direction:column;justify-content:space-between}
.marca{display:flex;align-items:center;gap:16px}.marca svg{width:56px;height:56px}.marca b{font:600 26px/1.1 Sora,sans-serif}.marca small{display:block;font:500 13px/1.2 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:rgba(243,243,237,.7);margin-top:4px}
h1{margin:0;font:700 72px/1.04 Sora,sans-serif;letter-spacing:-.04em;max-width:19ch}h1 em{font-style:normal;color:#d9f86f}
.rodape{display:flex;justify-content:space-between;align-items:center;font-size:22px;color:rgba(243,243,237,.8)}
.chip{padding:10px 18px;border-radius:999px;background:rgba(217,248,111,.14);color:#d9f86f;font:600 15px/1 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.icone{width:180px;height:180px;display:grid;place-items:center;background:#fff}.icone svg{width:180px;height:180px}
</style></head><body>
<div class="og" id="og">
  <div class="marca"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#d9f86f"/><path d="M9 21.5 15.5 10h4.2l-6.5 11.5zM15.6 21.5 22.1 10h1.9l-6.5 11.5z" fill="#103b30"/></svg><div><b>Site Express</b><small>Soluções Digitais</small></div></div>
  <h1>Seu cliente escolhe o corte. <em>O pedido chega pronto no WhatsApp.</em></h1>
  <div class="rodape"><span>Agenda Express para barbearias · a barbearia confirma o horário</span><span class="chip">Demonstração · barbearia fictícia</span></div>
</div>
<div class="icone" id="icone"><svg viewBox="0 0 32 32"><rect width="32" height="32" fill="#103B30"/><path d="M9 21.5 15.5 10h4.2l-6.5 11.5zM15.6 21.5 22.1 10h1.9l-6.5 11.5z" fill="#D9F86F"/></svg></div>
</body></html>
