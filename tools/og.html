<!doctype html>
<!-- Modelo da imagem de compartilhamento (assets/img/og.jpg). Gerada com tools/og.js. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; }
  .og { position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 1fr 520px;
    background: radial-gradient(60% 80% at 85% 20%, rgba(255,138,76,.18), transparent 70%), var(--marfim); }
  .og__txt { padding: 64px 0 64px 72px; display: flex; flex-direction: column; }
  .og h1 { font: 800 54px/1.06 var(--display); letter-spacing: -0.04em; margin-top: 28px; color: var(--verde); }
  .og .preco { margin-top: auto; border: 0; padding: 0; }
  .og__trio { margin: 44px 44px 0 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items: start; }
  .og__trio img { width: 100%; border-radius: 18px; border: 4px solid var(--carvao); box-shadow: 0 0 0 1px var(--line-strong); }
  .og__trio img:nth-child(2) { margin-top: -20px; }
</style>
</head>
<body>
  <div class="og">
    <div class="og__txt">
      <span class="marca"><img class="marca__logo" src="../assets/img/marca/logo-horizontal-verde.svg" alt="" style="height:40px"></span>
      <h1>Seu negócio bem apresentado. Seu contato fácil de encontrar.</h1>
      <div class="preco">
        <p class="preco__valor"><span class="preco__moeda">R$</span>497</p>
        <div class="preco__detalhe"><p class="preco__unico">Pagamento único</p><p>Sem mensalidade obrigatória</p></div>
      </div>
    </div>
    <div class="og__trio"><img src="../assets/img/demo-patas-felizes-banho-tosa-mobile-600.webp" alt=""><img src="../assets/img/demo-navalha-co-barbearia-mobile-600.webp" alt=""><img src="../assets/img/colecao-black-diamond-detail-mobile-600.webp" alt=""></div>
  </div>
</body>
</html>
